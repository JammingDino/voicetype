name: release

# Every push to main publishes a release, which installed copies pick up on
# their next launch. If Cargo.toml's version is already released, the patch
# number is bumped first (and committed back); to choose a version yourself,
# set it in Cargo.toml before pushing. Pushing a tag like v0.2.0 by hand still
# works, and so does running it from the Actions tab to get the exe as an
# artifact without publishing anything.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, to know which version is already released
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The bump commit is pushed with GITHUB_TOKEN, which doesn't start another run.
      - name: Pick the version
        id: version
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = [version](Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $bumped = $false
          if (git tag --list "v$v") {
            $v = [version]::new($v.Major, $v.Minor, $v.Build + 1)
            (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".+"', "version = `"$v`"" | Set-Content -NoNewline Cargo.toml
            $bumped = $true
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "bumped=$bumped" >> $env:GITHUB_OUTPUT

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml version v$v" }

      - run: cargo test --release
      - run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # The exe is its own installer; see src/install.rs.
          Copy-Item target/release/voicetype.exe dist/voicetype-setup.exe
          # The in-app updater refuses an exe that doesn't match this.
          (Get-FileHash dist/voicetype-setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline dist/voicetype-setup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: voicetype-setup
          path: dist/voicetype-setup.exe*

      # Only after tests and the build passed, so a broken push never bumps anything.
      - name: Commit the bumped version
        if: steps.version.outputs.bumped == 'True'
        shell: pwsh
        run: |
          # cargo build rewrote Cargo.lock with the new version.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build:              release ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}" -like 'refs/tags/*') { "${{ github.ref_name }}" } else { "v${{ steps.version.outputs.version }}" }
          gh release create $tag dist/voicetype-setup.exe dist/voicetype-setup.exe.sha256 --target (git rev-parse HEAD) --title "VoiceType $tag" --notes-file packaging/release-notes.md --generate-notes
