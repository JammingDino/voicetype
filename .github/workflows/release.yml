name: release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to build and publish
# a release. Run it by hand from the Actions tab to get the zip as an artifact
# without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != Cargo.toml version v$v" }

      - run: cargo test --release
      - run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # The exe is its own installer; see src/install.rs.
          Copy-Item target/release/voicetype.exe dist/voicetype-setup.exe
          # The in-app updater refuses an exe that doesn't match this.
          (Get-FileHash dist/voicetype-setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline dist/voicetype-setup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: voicetype-setup
          path: dist/voicetype-setup.exe*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/voicetype-setup.exe dist/voicetype-setup.exe.sha256 --title "voicetype ${{ github.ref_name }}" --notes-file packaging/release-notes.md --generate-notes
